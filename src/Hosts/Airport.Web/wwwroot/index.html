<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7f9" />
    <meta name="description" content="Aplicación para buscar vuelos y comprar boletos aeroportuarios." />
    <title>Airport</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app" class="app-loading">
        <div class="loading-brand">
            <span class="material-symbols-rounded" aria-hidden="true">flight_takeoff</span>
            <strong>Airport</strong>
        </div>
        <div class="loading-track"><span></span></div>
        <p>Preparando tu viaje…</p>
    </div>

    <div id="blazor-error-ui" role="alert">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <button type="button" class="dismiss" aria-label="Cerrar">×</button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
